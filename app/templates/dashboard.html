<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMDR2 — Products</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dashboard">
  <header>
    <span class="title">SMDR2</span>
    <span id="status">—</span>
    <span class="spacer"></span>
    <button id="dev-mode-toggle" type="button" aria-pressed="false"
            title="Reveal developer-only download affordances">Developer Mode</button>
    <label id="skip-layer-pick-wrap" class="dev-toggle-label" hidden
           title="Dev: bypass Phase 1 layer manifest + picker, use every layer">
      <input type="checkbox" id="skip-layer-pick" />
      Skip layer picker (dev)
    </label>
    <button id="dev-params-toggle" type="button" hidden
            title="Adjust matching / DXF tunables (dev mode only)">⚙</button>
  </header>

  <main class="dashboard-main">
    <section id="library-bar">
      <label for="library-select">Library:</label>
      <select id="library-select" aria-label="Active library"></select>
      <button id="new-library-btn" type="button" title="Create a new library">+ New library</button>
      <span class="spacer"></span>
      <button id="new-product-btn" type="button">+ New product</button>
    </section>

    <section id="product-list-section">
      <div id="product-list"></div>
      <p class="empty" id="empty-msg" hidden>No products yet — click <em>+ New product</em> to start.</p>
    </section>
  </main>

  <!-- New product modal -->
  <div id="product-modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-panel" role="dialog" aria-label="New product">
      <header class="modal-header">
        <h2>New product</h2>
        <span class="spacer"></span>
        <button type="button" class="modal-close" data-close>×</button>
      </header>
      <div class="modal-body">
        <label class="form-row">
          <span>Name</span>
          <input id="new-product-name" type="text" placeholder="e.g., Customer-A P/N 12345" />
        </label>
        <label class="form-row">
          <span>Library (customer)</span>
          <select id="new-product-library"></select>
        </label>
        <div class="form-actions">
          <button id="new-product-create" type="button">Create</button>
          <button type="button" data-close>Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Rule check results modal -->
  <div id="rule-results-modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-panel modal-wide" role="dialog" aria-label="Rule Check results">
      <header class="modal-header">
        <h2 id="rule-results-title">Rule Check</h2>
        <span id="rule-results-summary"></span>
        <span class="spacer"></span>
        <button type="button" class="modal-close" data-close>×</button>
      </header>
      <div id="rule-results-body"></div>
    </div>
  </div>

  <!-- Layer selection modal (auto-opens when a file reaches awaiting_layers) -->
  <div id="layer-modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-panel modal-wide" role="dialog" aria-label="Pick layers">
      <header class="modal-header">
        <h2 data-layer-title>Pick layers to include</h2>
        <span class="spacer"></span>
        <button type="button" class="modal-close" data-close>×</button>
      </header>
      <div data-layer-body class="layer-modal-body"></div>
      <footer class="modal-footer">
        <button type="button" data-layer-all class="link-btn">Select all</button>
        <button type="button" data-layer-none class="link-btn">Select none</button>
        <span class="spacer"></span>
        <button type="button" data-layer-confirm class="primary">Use selected</button>
      </footer>
    </div>
  </div>

  <!-- Developer parameter overrides modal (Dev Mode only) -->
  <div id="dev-params-modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-panel modal-wide" role="dialog" aria-label="Developer parameters">
      <header class="modal-header">
        <h2>Developer parameters</h2>
        <span class="spacer"></span>
        <button type="button" class="modal-close" data-close>×</button>
      </header>
      <div class="modal-body">
        <p class="dev-params-banner">
          In-memory only — restart clears every override. Do not change values
          while jobs are running.
        </p>
        <div id="dev-params-body"></div>
      </div>
      <footer class="modal-footer">
        <button type="button" id="dev-params-reset" class="link-btn">Reset to defaults</button>
        <button type="button" id="dev-params-reprocess" class="link-btn">Re-preprocess all files</button>
        <span class="spacer"></span>
        <button type="button" id="dev-params-apply" class="primary">Apply</button>
      </footer>
    </div>
  </div>

  <!-- Hidden file picker reused per slot -->
  <input type="file" id="file-input" accept=".dxf" hidden />

  <script type="module" src="/static/dashboard.js"></script>
</body>
</html>
