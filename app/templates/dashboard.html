<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMDR2 — Files</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dashboard">
  <header>
    <span class="title">SMDR2</span>
    <span id="status">—</span>
    <span class="spacer"></span>
  </header>

  <main class="dashboard-main">
    <section id="library-bar">
      <label for="library-select">Library:</label>
      <select id="library-select" aria-label="Active library"></select>
      <button id="new-library-btn" type="button" title="Create a new library">+ New library</button>
      <span id="library-info"></span>
    </section>

    <section id="upload-zone" tabindex="0" aria-label="Drop DXF files here">
      <p>Drop <code>.dxf</code> files here, or
        <button id="pick-files-btn" type="button">choose files</button>
        <span id="upload-target-lib"></span>
      </p>
      <input type="file" id="file-input" accept=".dxf" multiple hidden />
    </section>

    <section id="file-list-section">
      <table id="file-list" aria-label="Uploaded files">
        <thead>
          <tr>
            <th>Name</th>
            <th>Size</th>
            <th>Library</th>
            <th>Status</th>
            <th>Entities</th>
            <th>Uploaded</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <p class="empty" id="empty-msg" hidden>No files yet — drop DXFs above to get started.</p>
    </section>
  </main>

  <script type="module" src="/static/dashboard.js"></script>
</body>
</html>
