<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMDR2 Viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-file-id="{{ file_id }}" data-file-name="{{ file_name }}">
  <header>
    <a class="title" href="/" title="Back to dashboard">SMDR2</a>
    <a id="back-btn" href="/" title="Back to product dashboard">← Products</a>
    <span class="file-name" title="{{ file_name }}">{{ file_name }}</span>
    <span id="product-context"></span>
    <span id="role-switcher"></span>
    <select id="library-switcher" title="Library this file uses (set by its product)"></select>
    <button id="chain-btn" type="button" title="When on, single-click selects the whole connected chain">Chain</button>
    <button id="scan-all-btn" type="button" title="Run every saved template and highlight by class (hotkey: A)">Scan All</button>
    <button id="save-match-btn" type="button" title="Generate Match JSON for downstream rule checking">Save Match</button>
    <button id="library-btn" type="button" title="Manage saved templates (delete / move between classes)">Library</button>
    <button id="rules-btn" type="button" title="Show / hide rule-check results for this product">Rules</button>
    <span id="status">loading…</span>
    <span class="spacer"></span>
    <span id="mode-hint" class="hint"></span>
    <span id="handle-info">Handle —</span>
    <span id="cursor-coords">—</span>
  </header>
  <nav id="class-toolbar" aria-label="Object classes"></nav>
  <main>
    <canvas id="dxf-canvas"></canvas>
    <aside id="rule-sidebar" hidden>
      <header>
        <h3>Rule Check</h3>
        <span id="rule-sidebar-summary"></span>
        <button type="button" id="rule-sidebar-close" title="Hide">×</button>
      </header>
      <div id="rule-sidebar-body"></div>
    </aside>
  </main>

  <div id="library-modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-panel" role="dialog" aria-label="Template Library">
      <header class="modal-header">
        <h2>Template Library</h2>
        <span id="library-summary"></span>
        <span class="spacer"></span>
        <button type="button" class="modal-close" data-close>×</button>
      </header>
      <div id="library-body"></div>
    </div>
  </div>
  <script type="module" src="/static/canvas.js"></script>
</body>
</html>
