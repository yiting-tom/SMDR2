<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SMDR2 Viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-file-id="{{ file_id }}" data-file-name="{{ file_name }}">
  <header>
    <a id="back-btn" href="/" title="Back to product dashboard">← Products</a>
    <span class="file-name" title="{{ file_name }}">{{ file_name }}</span>
    <span id="product-context"></span>
    <span id="role-switcher"></span>
    <select id="library-switcher" title="Library this file uses (set by its product)"></select>
    <button id="library-btn" type="button" title="Manage saved templates (delete / move between classes)">📚 Library</button>
    <button id="scan-all-btn" type="button" title="Run every saved template and highlight by class (hotkey: A)">🔍 Scan All</button>
    <button id="save-match-btn" type="button" title="Generate Match JSON for downstream rule checking">💾 Save Match</button>
    <button id="measure-btn" type="button" title="Measure distance between two points · AutoCAD DIST (hotkey: D)">📏 Measure</button>
    <button id="visibility-btn" type="button" title="Toggle layer visibility on the canvas (does not change matching)">👁 Visibility</button>
    <button id="rules-btn" type="button" title="Show / hide rule-check results for this product">📋 Rules</button>
  </header>
  <nav id="class-toolbar" aria-label="Object classes">
    <button id="chain-btn" class="tool-btn" type="button" title="When on, single-click selects the whole connected chain">Chain</button>
    <button id="sides-btn" class="tool-btn" type="button" title="Mark frontside / bottomside regions · left-click to draw both, right-click for options (hotkey: R)">Sides</button>
    <span class="toolbar-sep" aria-hidden="true"></span>
  </nav>
  <div id="sides-menu" class="popup-menu" hidden>
    <button type="button" data-sides-action="both">Redraw both</button>
    <button type="button" data-sides-action="frontside">Redraw frontside only</button>
    <button type="button" data-sides-action="bottomside">Redraw bottomside only</button>
    <button type="button" data-sides-action="clear">Clear both</button>
  </div>
  <main>
    <canvas id="dxf-canvas"></canvas>
    <div id="measure-readout" class="measure-readout" hidden></div>
    <aside id="visibility-panel" class="floating-panel" hidden>
      <header>
        <h3>Layer visibility</h3>
        <span class="hint">live · session only</span>
        <span class="spacer"></span>
        <button type="button" id="visibility-close" title="Close">×</button>
      </header>
      <div id="visibility-list" class="visibility-list"></div>
      <footer>
        <button type="button" id="visibility-all" class="link-btn">Show all</button>
        <button type="button" id="visibility-invert" class="link-btn">Invert</button>
      </footer>
    </aside>
    <aside id="rule-sidebar" hidden>
      <header>
        <h3>Rule Check</h3>
        <span id="rule-sidebar-summary"></span>
        <button type="button" id="rule-sidebar-close" title="Hide">×</button>
      </header>
      <div id="rule-sidebar-body"></div>
    </aside>
    <footer id="canvas-statusbar">
      <span id="status">loading…</span>
      <span class="spacer"></span>
      <span id="mode-hint" class="hint"></span>
      <span id="handle-info">Handle —</span>
      <span id="cursor-coords">—</span>
    </footer>
  </main>

  <div id="library-modal" class="modal" hidden>
    <div class="modal-bg" data-close></div>
    <div class="modal-panel" role="dialog" aria-label="Template Library">
      <header class="modal-header">
        <h2>Template Library</h2>
        <span id="library-summary"></span>
        <span class="spacer"></span>
        <button type="button" class="modal-close" data-close>×</button>
      </header>
      <div id="library-body"></div>
    </div>
  </div>

  <script type="module" src="/static/canvas.js"></script>
</body>
</html>
