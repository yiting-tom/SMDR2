# Conform — company k8s deployment (mirrors docker-compose.yaml 1:1).
#
# Apply order: namespace → secrets (Vault / kubectl, NOT this repo) →
#   kubectl apply -f conform.yaml
# Everything env-var driven: this file + conform-secrets is the complete
# difference between dev compose and production (SYSTEM_DESIGN §13.1).
#
# Policy: every Deployment MUST set spec.replicas >= 2 (company rule,
# clarified 2026-06-12). Webs are stateless (sessions/jobs in MariaDB,
# blobs in MinIO) — rolling updates are zero-downtime. The worker runs
# separately so web rollouts never kill an in-flight preprocess; the
# claim protocol is multi-worker safe (two-step UPDATE, rowcount-judged),
# and a killed worker's job requeues after the 120s heartbeat staleness
# window.
#
# Memory: a 150MB DXF peaks ~6.3GiB in one preprocess worker (measured
# 2026-06-11) — each worker requests 8Gi with SMDR2_MAX_WORKERS=1, and
# two workers means two concurrent big-file preprocesses are possible.
# Raise SMDR2_MAX_WORKERS and the memory numbers together, never just
# the worker count.
#
# Placeholders to replace per environment: image registry/tag, the
# *.example.internal hosts, BOOTSTRAP_ADMINS.
apiVersion: v1
kind: Namespace
metadata:
  name: conform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: conform-config
  namespace: conform
data:
  SMDR2_DATA_DIR: /scratch
  SMDR2_MAX_UPLOAD_MB: "200"
  SMDR2_AUTH_MODE: oidc
  SMDR2_DEV_TOOLS: "0"          # dev overrides are process-local — must be off with >1 pod
  S3_BUCKET: conform
  # Fill per environment:
  S3_ENDPOINT_URL: http://minio.example.internal:9000
  OIDC_ISSUER: https://keycloak.example.internal/realms/conform
  OIDC_INTERNAL_BASE: http://keycloak.keycloak.svc:8080/realms/conform
  OIDC_CLIENT_ID: conform-web
  OIDC_REDIRECT_URI: https://conform.example.internal/auth/callback
  COOKIE_SECURE: "true"
  # Outbound TLS cert verification (Keycloak/MinIO https://). Self-signed
  # internal CA → "0" to skip, or a path to the mounted CA bundle to keep
  # verifying (e.g. SSL_VERIFY: /etc/ssl/internal-ca.pem).
  SSL_VERIFY: "1"
  BOOTSTRAP_ADMINS: ""          # comma-separated userids; set BEFORE first rollout
  # DB: set DATABASE_URL in the Secret, OR split — DB_USER/DB_PASSWORD in the
  # Secret + these non-secret parts here (app composes the URL, pw URL-encoded —
  # use the split form when the password has special chars; a hand-built
  # DATABASE_URL needs them percent-encoded yourself):
  #   DB_HOST: mariadb.example.internal   # required to trigger the parts path
  #   DB_PORT: "3306"                     # default 3306
  #   DB_NAME: conform                    # default conform
---
# The real Secret comes from Vault injection or:
#   kubectl -n conform create secret generic conform-secrets \
#     --from-literal=DATABASE_URL='mysql+pymysql://USER:PASS@mariadb.example.internal:3306/conform?charset=utf8mb4' \
#     --from-literal=S3_ACCESS_KEY_ID=... \
#     --from-literal=S3_SECRET_ACCESS_KEY=... \
#     --from-literal=OIDC_CLIENT_SECRET=... \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)"
# Never commit real values. OIDC group + SESSION_SECRET + S3 pair are required
# in oidc mode; for DB use DATABASE_URL OR DB_USER+DB_PASSWORD (+ DB_HOST cfg).
---
apiVersion: batch/v1
kind: Job
metadata:
  name: conform-migrate
  namespace: conform
  annotations:
    # Re-run on every deploy (e.g. `kubectl -n conform delete job conform-migrate`
    # in CD before apply, or switch to generateName). Alembic upgrades are
    # idempotent at head, so re-running is always safe.
    conform/purpose: alembic-upgrade-head
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry.example.internal/conform-app:latest
          command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: conform-config}
            - secretRef: {name: conform-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conform-web
  namespace: conform
spec:
  replicas: 2          # company policy — do not reduce
  strategy:
    rollingUpdate:     # webs are stateless: surge one, never drop below 2
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: conform-web}
  template:
    metadata:
      labels: {app: conform-web}
    spec:
      affinity:
        podAntiAffinity:   # spread the 2 webs across nodes when possible
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: conform-web}
      containers:
        - name: web
          image: registry.example.internal/conform-app:latest
          ports: [{containerPort: 8000}]
          env:
            - {name: SMDR2_EMBEDDED_WORKER, value: "0"}  # webs only enqueue
          envFrom:
            - configMapRef: {name: conform-config}
            - secretRef: {name: conform-secrets}
          resources:
            requests: {cpu: 250m, memory: 1Gi}
            # Viewer loads of huge parsed JSON can hold several hundred MB
            # (lru=4) — cap generously, monitor after launch.
            limits: {cpu: "2", memory: 4Gi}
          # Both auth-exempt (non-/api). Readiness = /readyz (pings DB / MinIO /
          # Keycloak → un-ready a pod that can't reach a dependency, so it stops
          # taking traffic). Liveness = /healthz (pure) — a dependency blip must
          # not restart the pod, only un-ready it.
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - {name: scratch, mountPath: /scratch}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 2Gi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: conform-web
  namespace: conform
spec:
  minAvailable: 1      # node drains never take both webs at once
  selector:
    matchLabels: {app: conform-web}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conform-worker
  namespace: conform
spec:
  replicas: 2          # company policy: every Deployment >= 2
  strategy:
    rollingUpdate:     # never a 3rd 8Gi pod during rollouts; the one going
      maxSurge: 0      # down hands its job over via the 120s stale-claim
      maxUnavailable: 1
  selector:
    matchLabels: {app: conform-worker}
  template:
    metadata:
      labels: {app: conform-worker}
    spec:
      terminationGracePeriodSeconds: 30   # jobs requeue via heartbeat anyway
      affinity:
        podAntiAffinity:   # two 8Gi workers should not share a node
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app: conform-worker}
      containers:
        - name: worker
          image: registry.example.internal/conform-app:latest
          command: ["uv", "run", "--no-sync", "python", "-m", "app.worker_loop"]
          env:
            # 150MB DXF ≈ 6.3GiB peak per concurrent preprocess (measured).
            - {name: SMDR2_MAX_WORKERS, value: "1"}
          envFrom:
            - configMapRef: {name: conform-config}
            - secretRef: {name: conform-secrets}
          # No HTTP surface → no probes. A hung loop self-heals through the
          # queue protocol: claims go stale after 120s and another attempt
          # (or a restarted pod) picks them up.
          resources:
            requests: {cpu: "1", memory: 8Gi}
            limits: {cpu: "4", memory: 10Gi}
          volumeMounts:
            - {name: scratch, mountPath: /scratch}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 4Gi}   # ≥ workers × 150MB src + 401MB derived
---
apiVersion: v1
kind: Service
metadata:
  name: conform-web
  namespace: conform
spec:
  selector: {app: conform-web}
  ports:
    - {port: 80, targetPort: 8000}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conform
  namespace: conform
  annotations:
    # Mirrors deploy/nginx/nginx.conf — SEC-001 upload cap with headroom.
    nginx.ingress.kubernetes.io/proxy-body-size: 200m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  # TLS terminates here (company wildcard cert / cert-manager — per IT).
  # COOKIE_SECURE=true assumes https on this hostname.
  rules:
    - host: conform.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: conform-web
                port: {number: 80}
