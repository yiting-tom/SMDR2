# Dev LB — stands in for the k8s ingress/service. Round-robin across the two
# web replicas so cross-replica bugs (in-memory job state, stale caches,
# local-disk artifacts) surface locally instead of in the company cluster.
events {}

http {
    upstream conform_web {
        # Deliberately no ip_hash / sticky: k8s services round-robin too.
        server web-1:8000;
        server web-2:8000;
    }

    server {
        listen 8080;

        # Matches SMDR2_MAX_UPLOAD_MB (SEC-001: 150MB max DXF + headroom).
        client_max_body_size 200m;

        location / {
            proxy_pass http://conform_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Preprocess/scan jobs poll async, but keep slack for slow saves.
            proxy_read_timeout 300s;
        }
    }
}
