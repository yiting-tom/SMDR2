[project]
name = "smdr2"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.3",
    "fastapi>=0.136.1",
    "jinja2>=3.1.6",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "python-multipart>=0.0.28",
    "rtree>=1.4.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
